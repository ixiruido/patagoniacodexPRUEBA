            widget: "list"
            fields:
              - {label: "Texto", name: "texto", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Email URL", name: "email_url", widget: "string"}
              - {label: "Atención", name: "atencion", widget: "string"}
              - {label: "WhatsApp Texto", name: "whatsapp_texto", widget: "string"}
              - {label: "WhatsApp URL", name: "whatsapp_url", widget: "string"}
              - {label: "Teléfono", name: "telefono", widget: "string"}
              - {label: "Teléfono URL", name: "telefono_url", widget: "string"}
          - {label: "QR Imagen", name: "qr_imagen", widget: "image"}
          - {label: "QR Alt", name: "qr_alt", widget: "string"}
          - {label: "QR Texto", name: "qr_texto", widget: "string"}
          - {label: "Copyright", name: "copyright", widget: "string"}
          - {label: "WhatsApp Float URL", name: "whatsapp_float_url", widget: "string"}

