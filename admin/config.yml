backend:
  name: github
  repo: ixiruido/patagoniacodexPRUEBA
  branch: main
  base_url: https://patagoniacodexprueba.ixi-b.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "home"
    label: "Página Principal (Patagonia Codex)"
    file: "content/home.json"
    fields:
      - label: "Meta Información"
        name: "meta"
        widget: "object"
        fields:
          - {label: "Título", name: "titulo", widget: "string"}
          - {label: "Descripción", name: "descripcion", widget: "string"}
          - {label: "Canonical", name: "canonical", widget: "string"}
          - {label: "Robots", name: "robots", widget: "string"}
          - {label: "Favicon", name: "favicon", widget: "string"}
          - {label: "OG Title", name: "og_title", widget: "string"}
          - {label: "OG Description", name: "og_description", widget: "string"}
          - {label: "OG Image", name: "og_image", widget: "string"}
          - {label: "OG URL", name: "og_url", widget: "string"}
          - {label: "OG Locale", name: "og_locale", widget: "string"}
          - {label: "Theme Color", name: "theme_color", widget: "string"}
          - {label: "Twitter Title", name: "twitter_title", widget: "string"}
          - {label: "Twitter Description", name: "twitter_description", widget: "string"}
          - {label: "Twitter Image", name: "twitter_image", widget: "string"}
      - label: "Header"
        name: "header"
        widget: "object"
        fields:
          - {label: "Logo Texto", name: "logo_texto", widget: "string"}
          - {label: "Logo Subtexto", name: "logo_subtexto", widget: "string"}
          - {label: "Logo URL", name: "logo_url", widget: "string"}
          - label: "Navegación"
            name: "navegacion"
            widget: "list"
            fields:
              - {label: "Texto", name: "texto", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
      - label: "Secciones"
        name: "secciones"
        widget: "list"
        types:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "hero"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Subtítulo", name: "subtitulo", widget: "text"}
              - {label: "Botón Texto", name: "boton_texto", widget: "string"}
              - {label: "Botón URL", name: "boton_url", widget: "string"}
              - {label: "Fondo", name: "fondo", widget: "image"}
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "about"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Texto", name: "texto", widget: "text"}
              - {label: "Imagen", name: "imagen", widget: "image"}
              - {label: "Imagen Alt", name: "imagen_alt", widget: "string"}
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "services"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - label: "Tarjetas"
                name: "tarjetas"
                widget: "list"
                fields:
                  - {label: "Título", name: "titulo", widget: "string"}
                  - {label: "Descripción", name: "descripcion", widget: "text"}
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "contact"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Subtítulo", name: "subtitulo", widget: "string"}
              - label: "Tarjetas"
                name: "tarjetas"
                widget: "list"
                fields:
                  - {label: "Tipo", name: "tipo", widget: "select", options: ["whatsapp", "instagram", "email"]}
                  - {label: "Título", name: "titulo", widget: "string"}
                  - {label: "Descripción", name: "descripcion", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
          - label: "Pricing"
            name: "pricing"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "pricing"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Subtítulo", name: "subtitulo", widget: "string"}
              - label: "Tarjetas"
                name: "tarjetas"
                widget: "list"
                fields:
                  - {label: "Imagen", name: "imagen", widget: "image"}
                  - {label: "Imagen Alt", name: "imagen_alt", widget: "string"}
                  - {label: "Título", name: "titulo", widget: "string"}
                  - {label: "Precio", name: "precio", widget: "string"}
                  - {label: "Moneda", name: "moneda", widget: "string"}
                  - {label: "Período", name: "periodo", widget: "text"}
                  - {label: "Método de Pago", name: "metodo_pago", widget: "string"}
                  - {label: "Incluye", name: "incluye", widget: "text"}
                  - {label: "Botón URL", name: "boton_url", widget: "string"}
                  - label: "Términos"
                    name: "terminos"
                    widget: "list"
                    field: {label: "Término", name: "termino", widget: "string"}
          - label: "Demos"
            name: "demos"
            widget: "object"
            fields:
              - {label: "Tipo", name: "tipo", widget: "hidden", default: "demos"}
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Subtítulo", name: "subtitulo", widget: "string"}
              - label: "Tarjetas"
                name: "tarjetas"
                widget: "list"
                fields:
                  - {label: "Imagen", name: "imagen", widget: "image"}
                  - {label: "Imagen Alt", name: "imagen_alt", widget: "string"}
                  - {label: "Título", name: "titulo", widget: "string"}
                  - {label: "Descripción", name: "descripcion", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
      - label: "Footer"
        name: "footer"
        widget: "object"
        fields:
          - {label: "Logo Texto", name: "logo_texto", widget: "string"}
          - {label: "Logo Subtexto", name: "logo_subtexto", widget: "string"}
          - {label: "Logo URL", name: "logo_url", widget: "string"}
          - {label: "Descripción", name: "descripcion", widget: "text"}
          - label: "Navegación"
